# QuickTec on OpenMediaVault.
#
# The app is not exposed to the internet: Nginx Proxy Manager terminates TLS for
# quicktec.417group.org and the whole subnet sits behind Tailscale. Only NPM
# needs to reach port 3000, so nothing here publishes to 0.0.0.0 by default —
# adjust APP_BIND if NPM runs on another host.

# Built from POSTGRES_* so the password is written down exactly once. Setting
# DATABASE_URL in .env still wins, which is how you point at a Postgres that is
# not this compose file's.
x-database-url: &database-url ${DATABASE_URL:-postgresql://${POSTGRES_USER:-quicktec}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-quicktec}?schema=public}

services:
  db:
    image: postgres:17-alpine
    container_name: quicktec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quicktec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quicktec}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # Defaults sit beside this file; point them at a pool dataset on OMV by
      # setting the variables in .env.
      - ${POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quicktec} -d ${POSTGRES_DB:-quicktec}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [quicktec]

  # Runs migrations and the idempotent seed, then exits. The app waits for it to
  # finish so it never serves traffic against an out-of-date schema.
  migrate:
    build:
      context: .
      target: migrator
    container_name: quicktec-migrate
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      TZ: ${TZ:-America/Los_Angeles}
      # How long a schema change waits for a table the old app is still using
      # before giving up and saying so. Without it a deploy hangs indefinitely
      # and takes the running app down with it.
      MIGRATE_LOCK_TIMEOUT: ${MIGRATE_LOCK_TIMEOUT:-15s}
    depends_on:
      db:
        condition: service_healthy
    networks: [quicktec]

  app:
    build:
      context: .
      target: runner
    container_name: quicktec-app
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      AUTH_URL: ${AUTH_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      NEXTCLOUD_ISSUER: ${NEXTCLOUD_ISSUER}
      NEXTCLOUD_WELL_KNOWN: ${NEXTCLOUD_WELL_KNOWN:-}
      NEXTCLOUD_CLIENT_ID: ${NEXTCLOUD_CLIENT_ID}
      NEXTCLOUD_CLIENT_SECRET: ${NEXTCLOUD_CLIENT_SECRET}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/data/uploads}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # Photos and generated exports. The container runs as uid 1001, so this
      # directory has to be owned by 1001:1001 on the host.
      # Required rather than defaulted. A fallback here mounts a directory
      # Docker created as root, the app cannot write to it, and nothing says so
      # until the first photo — so refusing to start is the kinder failure.
      - ${UPLOADS_HOST_DIR:?set UPLOADS_HOST_DIR in .env, and chown it 1001:1001}:/data/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [quicktec]

networks:
  quicktec:
    driver: bridge
