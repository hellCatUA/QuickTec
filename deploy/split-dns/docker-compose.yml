# The VPN-side resolver for quicktec.417group.org. See docs/SPLIT-DNS.md.
#
# Deliberately a stack of its own rather than a service in the app's compose
# file. Bringing the app down for a deploy would otherwise take DNS with it,
# and the failure that produces is the ugly one: not "QuickTec is restarting"
# but a name that does not resolve at all, on every device, until it is back.
#
#   cp records.conf.example records.conf   # and put the address in it
#   docker compose up -d
#
# Nothing here is published to the internet and nothing needs a port forward.

name: quicktec-split-dns

services:
  dns:
    image: dockurr/dnsmasq:2.93
    container_name: quicktec-dns
    restart: unless-stopped

    # Host networking so dnsmasq sees tailscale0 itself and binds to it as it
    # appears. Published ports would work too, but only once the interface
    # exists — and they put Docker's userland proxy in front of UDP, which
    # rewrites the source address of every question asked.
    network_mode: host

    # bind-dynamic opens a socket on tailscale0 whenever it turns up, which is
    # long after dnsmasq has dropped to an unprivileged user. Without this it
    # binds loopback, starts cleanly, logs a warning nobody reads, and answers
    # nothing.
    cap_add:
      - NET_ADMIN

    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
      # Create this from records.conf.example FIRST. Docker makes a directory
      # out of a bind mount whose source is missing, and dnsmasq is perfectly
      # happy to start with an empty conf-dir.
      - ./records.conf:/etc/dnsmasq.d/records.conf:ro

    # Asks the running dnsmasq the only question it exists to answer. Set
    # DNS_NAME in the environment if the app is served under another name.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nslookup ${DNS_NAME:-quicktec.417group.org} 127.0.0.1 > /dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
