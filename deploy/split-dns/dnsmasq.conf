# The resolver that makes one name mean two things.
#
# Off the VPN, quicktec.417group.org is a Cloudflare-hosted page that says the
# VPN is needed. On the VPN, this answers the same question with the server's
# address instead — so the app opens, and that address is nowhere in public DNS.
#
# The site-specific half lives in records.conf next to this file, which is not
# in git. Nothing here needs editing per install.
#
# docs/SPLIT-DNS.md has the surrounding steps.

# The one name we are authoritative for, kept out of this file so that a
# `git pull` never has an opinion about a server's own address.
conf-dir=/etc/dnsmasq.d,*.conf

# Only where the VPN is. Deliberately not the LAN and not the internet: the
# whole point is that this answer is reachable from inside and nowhere else.
#
# bind-dynamic rather than the usual bind-interfaces because tailscale0 does
# not exist yet when the machine boots. Static binding fails, the container
# restarts into the same race, and DNS comes back some minutes later than the
# rest of the stack — or not at all. This binds each interface as it appears.
interface=tailscale0
interface=lo
bind-dynamic

# Everything that is not the split domain. The VPN only routes that one domain
# here, so this is a safety net rather than a daily path — but a resolver that
# SERVFAILs whatever it was not told about fails in a way nobody traces back to
# this file.
server=1.1.1.1
server=1.0.0.1

# Never send a bare hostname or a reverse lookup for a private range upstream.
domain-needed
bogus-priv

# The image starts as root to bind :53 and drops to this. Keep it in step with
# cap_add: NET_ADMIN in the compose file — bind-dynamic has to open a socket
# on tailscale0 long after the privileges are gone.
user=dnsmasq
group=dnsmasq

# There is one name in it.
cache-size=150

# Uncomment while proving the split works; `docker logs quicktec-dns` then
# shows every question and the answer given. Comment it back out afterwards —
# it logs which sites people are opening.
#log-queries
