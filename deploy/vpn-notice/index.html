<!doctype html>
<!--
  What the public internet sees at quicktec.417group.org.

  Served by Cloudflare, from Cloudflare's own machines. Nothing about where
  QuickTec actually runs appears in this file, and nothing here should ever be
  added to it: no address, no VPN product name, no internal hostname. Anyone
  can read it.

  404.html is a byte-for-byte copy, so that a bookmarked deep link lands on the
  same explanation rather than a Cloudflare error page. scripts/verify-domain.ts
  fails if the two drift apart — edit this one and copy it across.

  The company mark is traced from the logo and drawn in currentColor, so it
  follows the theme rather than needing a second copy. Its middle section is
  broken on purpose: the logo already draws a laptop, the company, and the
  network it reaches, so cutting the link says the whole thing without a word.
-->

    />
    <style>
      :root {
        --background: oklch(0.17 0.012 260);
        --foreground: oklch(0.96 0.005 260);
        --muted-foreground: oklch(0.7 0.018 260);
        --border: oklch(0.31 0.016 260);
        --primary: oklch(0.66 0.16 235);
        --primary-foreground: oklch(0.16 0.02 260);
        /* The app's danger red, pushed a little brighter. It is carrying the
           whole message here at four pixels wide, rather than sitting under a
           line of text. */
        --danger: oklch(0.68 0.22 27);
        --radius: 0.625rem;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --background: oklch(0.98 0.003 260);
          --foreground: oklch(0.22 0.015 260);
          --muted-foreground: oklch(0.5 0.018 260);
          --border: oklch(0.9 0.006 260);
          --primary: oklch(0.52 0.16 235);
          --primary-foreground: oklch(0.99 0.005 235);
          --danger: oklch(0.55 0.22 27);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem calc(1.5rem + env(safe-area-inset-right)) 1.5rem
          calc(1.5rem + env(safe-area-inset-left));
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        text-align: center;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: 100%;
        max-width: 26rem;
      }

      .mark {
        display: block;
        width: 100%;
        height: auto;
        margin-bottom: 2rem;
        color: var(--foreground);
      }

      /* Slow, and nowhere near off. It is standing in for the check running
         underneath every few seconds, not asking for attention. */
      .mark .break {
        animation: pulse 2.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark .break {
          animation: none;
        }
      }

      h1 {
        margin: 0 0 0.625rem;
        font-size: 1.375rem;
        line-height: 1.3;
        font-weight: 650;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        color: var(--muted-foreground);
      }

      button {
        appearance: none;
        border: 0;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.625rem 1.5rem;
        cursor: pointer;
        min-height: 2.75rem;
      }

      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      #status {
        margin: 0.875rem 0 0;
        min-height: 1.25rem;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }

      #status[data-state="failed"] {
        color: var(--danger);
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
    </style>
  </head>

      <h1>Turn on the VPN</h1>

      <p>
        QuickTec runs on the company network. Connect, and this page opens it
        for you.
      </p>

      <button type="button" id="retry">Try now</button>
      <p id="status" role="status" aria-live="polite"></p>

      <footer>No VPN on this device yet? Ask the office.</footer>
    </main>

    <script>
      // The same address means something different once the VPN is on, so the
      // only reliable test is to ask for something and see who answers. From
      // out here that request goes to Cloudflare, which has no /api/health and
      // says so; from behind the VPN it reaches QuickTec, which does.
      //
      // Nothing in this file knows where QuickTec is. The request is relative,
      // and whatever the device resolves the name to today is where it goes.
      (function () {
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");
        var checking = false;

        function say(text, state) {
          status.textContent = text;
          if (state) status.setAttribute("data-state", state);
          else status.removeAttribute("data-state");
        }

        function check(loud) {
          if (checking) return;
          checking = true;
          if (loud) say("Checking…");

          // A short deadline on purpose. The usual failure here is a name that
          // resolves to somewhere with no route to it, which is not refused —
          // it is simply never answered, and the browser will wait out its own
          // connect timeout before admitting it.
          var timer = setTimeout(finish, 8000);
          var done = false;

          function finish(reached) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            checking = false;
            if (reached) {
              say("Connected. Opening QuickTec…");
              location.reload();
            } else if (loud) {
              say("Still cannot reach it. Check that the VPN is on.", "failed");
            }
          }

          fetch("/api/health", { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) return null;
              return response.json().catch(function () {
                return null;
              });
            })
            .then(function (body) {
              // Cloudflare answers everything on this hostname while the VPN is
              // off, so "the request succeeded" is not the question. "QuickTec
              // itself answered" is.
              finish(Boolean(body && body.ok === true));
            })
            .catch(function () {
              finish(false);
            });
        }

        retry.addEventListener("click", function () {
          check(true);
        });

        // Quietly, while somebody is actually looking at the page. A phone in
        // a pocket does not need to be asking.
        setInterval(function () {
          if (document.visibilityState === "visible") check(false);
        }, 15000);

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") check(false);
        });

        // Switching the VPN on often looks like a network change to the
        // browser, which is the earliest notice we get.
        window.addEventListener("online", function () {
          check(false);
        });

        check(false);
      })();
    </script>
  </body>
</html>
